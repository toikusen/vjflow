<section class="flow" aria-labelledby="flow-h">
  <div class="head">
    <h2 id="flow-h">做影片</h2>
    <span class="free">免費</span>
    @if (styleNow(); as n) {
      <span class="style-now">風格：<strong>{{ n }}</strong></span>
    }
    @if (!draft()) {
      <a class="timing" [href]="timingHref()">編輯歌詞時間</a>
    }
  </div>

  <app-instant-stage [source]="source" [audioFile]="audioFile" [title]="song().title" [timingNote]="timingNote()" [exportHold]="exportHold()" [plain]="true" (changed)="remember()" (again)="stage().request('first')">
    <button class="button primary" type="button" [disabled]="!!stage().busy()" (click)="stage().generate('first')">{{ stage().busy() ? '生成中…' : '立即生成' }}</button>
    <p class="use">{{ draft() ? '用你剛上傳的歌詞和音檔，不用等準備完成。' : '用這首歌的歌詞和音檔，不用等。' }}</p>
  </app-instant-stage>

  @if (!draft()) {
  <div class="paid">
    <p><strong>想要更專屬的版本？</strong> {{ paidLine() }}</p>
    <button class="button" type="button" (click)="paid.emit()">看付費方案</button>
  </div>
  }
</section>
