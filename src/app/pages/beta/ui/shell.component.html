<aside class="side" aria-label="主選單">
  <a class="logo" href="/my" aria-label="VJFlow 我的歌曲">VJ</a>
  <nav class="side-nav">
    <a class="tab" href="/my" [class.on]="spec().active === 'songs'" [attr.aria-current]="spec().active === 'songs' ? 'page' : null"><span class="ico square"></span>歌曲</a>
    <!-- 風格 is hidden until its page has content (it only says 即將推出); the route and styles.page.ts stay -->
    @if (me()?.admin) {
      <a class="tab" href="/my/admin" [class.on]="spec().active === 'admin'" [attr.aria-current]="spec().active === 'admin' ? 'page' : null"><span class="ico box"></span>管理</a>
    }
  </nav>
  @if (me(); as m) {
    <span class="avatar" [title]="m.name">{{ m.name.slice(0, 1).toUpperCase() }}</span>
  }
</aside>

<header class="phone-top" [class.own]="spec().ownTop">
  @if (spec().back; as b) {
    <a class="back" [href]="b.href">← {{ b.label }}</a>
  } @else {
    <a class="logo small" href="/my" aria-label="VJFlow 我的歌曲">VJ</a>
    <h1 class="title">{{ spec().title }}</h1>
  }
  @if (me(); as m) {
    <app-balance class="pill" [me]="m" look="phone" />
  }
</header>

<main class="main">
  <ng-content />
</main>

@if (sheet() && me(); as m) {
  <div class="sheet" role="dialog" aria-label="我">
    <div class="sheet-head">
      <span class="avatar">{{ m.name.slice(0, 1).toUpperCase() }}</span>
      <strong>{{ m.name }}</strong>
      <app-balance class="sheet-pill" [me]="m" look="phone" drop="up" />
    </div>
    @if (m.admin) {
      <a class="button soft" href="/my/admin">管理</a>
    }
  </div>
}

<nav class="phone-tabs" aria-label="主選單">
  <a class="tab" href="/my" [class.on]="!sheet() && spec().active === 'songs'" [attr.aria-current]="spec().active === 'songs' ? 'page' : null"><span class="ico square"></span>歌曲</a>
  <!-- 風格 is hidden until its page has content (it only says 即將推出); the route and styles.page.ts stay -->
  <button class="tab" type="button" [class.on]="sheet() || spec().active === 'admin'" [attr.aria-expanded]="sheet()" (click)="sheet.set(!sheet())"><span class="ico dot"></span>我</button>
</nav>
